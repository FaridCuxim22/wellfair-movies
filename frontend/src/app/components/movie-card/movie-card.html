<article class="card h-100 shadow-sm">
  <!-- Movie es un InputSignal, este contiene el valor recibido del componente padre  -->
  @if (movie().poster_path) {
    <img
      class="card-img-top movie-poster"
      [src]="'https://image.tmdb.org/t/p/w500' + movie().poster_path"
      [alt]="'Póster de ' + movie().title"
      loading="lazy"
    />
    <!-- loading="lazy" pospone la descargar hasta que esté cerca de la parte visible de la pantalla -->
  } @else {
    <img
      class="card-img-top movie-poster"
      [src]="'/images/no-poster.webp'"
      [alt]="'Póster no disponible para ' + movie().title"
      loading="lazy"
    />
  }

  <div class="card-body d-flex flex-column">
    <h2 class="card-title fs-6">
      {{ movie().title }}
    </h2>

    <p class="card-text small text-body-secondary">
      Estreno: {{ movie().release_date || 'Sin fecha' }}
    </p>

    <p class="card-text">⭐ {{ movie().vote_average.toFixed(1) }} / 10</p>

    <!-- data-bs-toggle indica que funcionalidad de JS de Boostrap debe cargar -->
    <button
      type="button"
      class="btn btn-primary mt-auto"
      data-bs-toggle="modal"
      data-bs-target="#movieDetailsModal"
      (click)="showDetails()"
    >
      Ver detalles
    </button>

    <!-- [attr.aria-pressed] indica si este topggle botón está activado -->
    <button
      type="button"
      class="btn btn-outline-danger mt-2"
      [attr.aria-pressed]="isFavorite()"
      (click)="toggleFavorite()"
    >
      {{ isFavorite() ? '♥ Quitar de favoritos' : '♡ Agregar a favoritos' }}
    </button>
  </div>
</article>
